</head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin flex items-center justify-between gap-space-xs"><div class="flex items-center gap-space-xs min-w-0"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="Sarkar-Sakhi Logo" class="h-8 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3TYNqzgX7AqzvfrN7LNwh1TOY_9obbz_a4STYRdemoGGxAR8vFxGqBCT3CYioBan8_Zsg3Gc9MVaQGDlXkULsgwOLfMgku073rKoj8XsbDI4G5Do2lBdFLgMJeju5uIxXj4pRcvIAsn6ePTemOKikoHYoJshHM4L9xMQwmIeWd-5mzZy9Xz41lNRcuCZv01bOQM6Nuvp8hvqqWS3jh5_a9oWwQgOxVGod6Losfyc"/><div class="flex flex-col min-w-0"><span class="font-label-lg text-label-lg text-secondary leading-none truncate">Sarkar-Sakhi</span><span class="font-caption text-caption text-on-surface-variant leading-tight truncate">Question</span></div></div><div class="flex items-center shrink-0"><button class="min-h-[44px] px-space-md rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md font-bold flex items-center gap-2 hover:bg-secondary-fixed transition-colors shadow-sm" type="button"><span class="material-symbols-outlined text-[20px]">translate</span><span>EN / తెలుగు</span></button></div></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface flex-1"><div class="flex flex-col w-full gap-space-md pb-space-lg pt-space-sm">
<!-- Progress Dots (5 large dots, 2nd dot active in primary) -->
<div class="flex items-center justify-between bg-surface-container-low rounded-full px-space-md py-space-sm shadow-sm">
<span class="font-caption text-caption text-on-surface-variant">Step 2 of 5</span>
<div aria-valuemax="5" aria-valuemin="1" aria-valuenow="2" class="flex items-center gap-space-xs" role="progressbar">
<span class="w-4 h-4 rounded-full bg-secondary"></span>
<span class="w-6 h-4 rounded-full bg-primary shadow-sm"></span>
<span class="w-4 h-4 rounded-full bg-surface-container-highest"></span>
<span class="w-4 h-4 rounded-full bg-surface-container-highest"></span>
<span class="w-4 h-4 rounded-full bg-surface-container-highest"></span>
</div>
</div>
<!-- Question & Audio Prompt -->
<div class="flex flex-col items-start gap-space-sm bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
      How old are you?
    </h1>
<button class="inline-flex items-center gap-space-xs min-h-[56px] px-space-md rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-[20px] shadow-sm active:scale-95 transition-transform" id="hear-again-btn" type="button">
<span class="material-symbols-outlined text-[26px]" id="hear-icon">volume_up</span>
<span id="hear-label">Hear again</span>
</button>
</div>
<!-- 4 Big Full-Width Tap-Answer Cards (Telangana Aasara 57+ Eligibility) -->
<div aria-label="Age group" class="flex flex-col gap-space-sm" id="answer-options" role="radiogroup">
<button class="answer-card w-full min-h-[72px] px-space-md py-space-sm rounded-xl bg-surface-container-lowest text-on-surface shadow-md flex items-center justify-between gap-space-sm active:translate-y-0.5 transition-all text-left" data-option="under-57" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[28px]">person</span>
</div>
<span class="font-label-lg text-label-lg truncate">Under 57 years</span>
</div>
<span class="check-icon material-symbols-outlined text-[28px] text-on-surface-variant shrink-0">radio_button_unchecked</span>
</button>
<button class="answer-card w-full min-h-[72px] px-space-md py-space-sm rounded-xl bg-surface-container-lowest text-on-surface shadow-md flex items-center justify-between gap-space-sm active:translate-y-0.5 transition-all text-left" data-option="57-64" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[28px]">elderly</span>
</div>
<span class="font-label-lg text-label-lg truncate">57 to 64 years</span>
</div>
<span class="check-icon material-symbols-outlined text-[28px] text-on-surface-variant shrink-0">radio_button_unchecked</span>
</button>
<button class="answer-card w-full min-h-[72px] px-space-md py-space-sm rounded-xl bg-surface-container-lowest text-on-surface shadow-md flex items-center justify-between gap-space-sm active:translate-y-0.5 transition-all text-left" data-option="65-79" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[28px]">elderly_woman</span>
</div>
<span class="font-label-lg text-label-lg truncate">65 to 79 years</span>
</div>
<span class="check-icon material-symbols-outlined text-[28px] text-on-surface-variant shrink-0">radio_button_unchecked</span>
</button>
<button class="answer-card w-full min-h-[72px] px-space-md py-space-sm rounded-xl bg-surface-container-lowest text-on-surface shadow-md flex items-center justify-between gap-space-sm active:translate-y-0.5 transition-all text-left" data-option="80-plus" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[28px]">accessible_forward</span>
</div>
<span class="font-label-lg text-label-lg truncate">80 years or older</span>
</div>
<span class="check-icon material-symbols-outlined text-[28px] text-on-surface-variant shrink-0">radio_button_unchecked</span>
</button>
</div>
<!-- Accessible Microphone Button at the Bottom -->
<div class="flex justify-center pt-space-xs">
<button class="inline-flex items-center justify-center gap-space-xs min-h-[56px] px-space-lg rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-lg active:scale-95 transition-transform" id="speak-answer-btn" type="button">
<span class="material-symbols-outlined text-[28px]" id="mic-icon">mic</span>
<span id="mic-label">Speak answer</span>
</button>
</div>
</div>
<script>
  (function () {
    const cards = document.querySelectorAll('.answer-card');
    cards.forEach((card) => {
      card.addEventListener('click', () => {
        cards.forEach((c) => {
          c.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
          c.classList.add('bg-surface-container-lowest', 'text-on-surface');
          const icon = c.querySelector('.check-icon');
          icon.textContent = 'radio_button_unchecked';
          icon.style.fontVariationSettings = "'FILL' 0";
          icon.classList.remove('text-primary');
          icon.classList.add('text-on-surface-variant');
        });
        card.classList.remove('bg-surface-container-lowest', 'text-on-surface');
        card.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
        const activeIcon = card.querySelector('.check-icon');
        activeIcon.textContent = 'check_circle';
        activeIcon.style.fontVariationSettings = "'FILL' 1";
        activeIcon.classList.remove('text-on-surface-variant');
        activeIcon.classList.add('text-primary');
      });
    });

    const hearBtn = document.getElementById('hear-again-btn');
    const hearLabel = document.getElementById('hear-label');
    const hearIcon = document.getElementById('hear-icon');
    let hearTimer = null;

    hearBtn.addEventListener('click', () => {
      clearTimeout(hearTimer);
      hearLabel.textContent = 'Playing...';
      hearIcon.textContent = 'graphic_eq';
      hearTimer = setTimeout(() => {
        hearLabel.textContent = 'Hear again';
        hearIcon.textContent = 'volume_up';
      }, 2000);
    });

    const micBtn = document.getElementById('speak-answer-btn');
    const micLabel = document.getElementById('mic-label');
    const micIcon = document.getElementById('mic-icon');
    let listening = false;

    micBtn.addEventListener('click', () => {
      listening = !listening;
      if (listening) {
        micLabel.textContent = 'Listening...';
        micIcon.textContent = 'graphic_eq';
        micBtn.classList.add('animate-pulse');
      } else {
        micLabel.textContent = 'Speak answer';
        micIcon.textContent = 'mic';
        micBtn.classList.remove('animate-pulse');
      }
    });
  })();
</script></main></body></html>

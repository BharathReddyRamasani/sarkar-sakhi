-container-highest":"#e1e3e4","tertiary-fixed":"#d1e4ff","on-secondary-fixed-variant":"#00504b","on-secondary-fixed":"#00201e","tertiary":"#005fa0","on-tertiary-container":"#fdfcff","on-surface-variant":"#584237","surface-variant":"#e1e3e4","on-tertiary-fixed":"#001d36","on-tertiary-fixed-variant":"#00497d","error-container":"#ffdad6","surface-container":"#eceeef","secondary-container":"#a7ece5","on-tertiary":"#ffffff","primary-fixed-dim":"#ffb690"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter":"1rem","space-md":"1.25rem","space-lg":"1.75rem","margin":"1.25rem","space-sm":"0.75rem","space-xl":"2.5rem","space-xs":"0.5rem"},"fontFamily":{"caption":["Noto Sans"],"headline-md":["Noto Sans"],"label-md":["Noto Sans"],"headline-sm":["Noto Sans"],"body-lg":["Noto Sans"],"headline-lg":["Noto Sans"],"label-lg":["Noto Sans"],"body-md":["Noto Sans"],"headline-lg-mobile":["Noto Sans"]},"fontSize":{"caption":["16px",{"lineHeight":"24px","letterSpacing":"0.01em","fontWeight":"500"}],"headline-md":["24px",{"lineHeight":"34px","letterSpacing":"0em","fontWeight":"700"}],"label-md":["18px",{"lineHeight":"24px","letterSpacing":"0.02em","fontWeight":"700"}],"headline-sm":["22px",{"lineHeight":"32px","letterSpacing":"0em","fontWeight":"600"}],"body-lg":["22px",{"lineHeight":"33px","letterSpacing":"0.01em","fontWeight":"400"}],"headline-lg":["28px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"700"}],"label-lg":["20px",{"lineHeight":"26px","letterSpacing":"0.02em","fontWeight":"700"}],"body-md":["20px",{"lineHeight":"30px","letterSpacing":"0.01em","fontWeight":"400"}],"headline-lg-mobile":["24px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"700"}]}}}}</script></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-20 px-margin flex items-center justify-between gap-space-xs"><div class="flex items-center gap-space-xs min-w-0"><button aria-label="Go back" class="w-14 h-14 min-h-[56px] min-w-[56px] flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[28px]">arrow_back</span></button><img alt="Sarkar-Sakhi Logo" class="h-10 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3TYNqzgX7AqzvfrN7LNwh1TOY_9obbz_a4STYRdemoGGxAR8vFxGqBCT3CYioBan8_Zsg3Gc9MVaQGDlXkULsgwOLfMgku073rKoj8XsbDI4G5Do2lBdFLgMJeju5uIxXj4pRcvIAsn6ePTemOKikoHYoJshHM4L9xMQwmIeWd-5mzZy9Xz41lNRcuCZv01bOQM6Nuvp8hvqqWS3jh5_a9oWwQgOxVGod6Losfyc"/><div class="flex flex-col min-w-0 ml-1"><span class="font-headline-sm text-headline-sm text-secondary leading-none truncate">Sarkar-Sakhi</span><span class="font-caption text-caption text-on-surface-variant leading-tight truncate">Home</span></div></div><div class="flex items-center shrink-0"><button aria-label="Switch Language" class="min-h-[56px] px-space-md rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-label-lg flex items-center gap-space-xs shadow-sm active:scale-95 transition-transform" id="lang-toggle" type="button"><span class="material-symbols-outlined text-[26px]">translate</span><span id="lang-label">తెలుగు / EN</span></button></div></div></header><main class="flex flex-col relative w-full px-margin pt-24 pb-safe bg-surface flex-1"><div class="flex flex-col w-full gap-space-lg py-space-md">
<!-- Greeting Banner -->
<div class="bg-primary-fixed/40 rounded-xl p-space-md text-center shadow-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface" id="greeting-text">నమస్తే! పెన్షన్ల గురించి అడగండి.</h1>
</div>
<!-- Giant Pulsing Saffron Microphone Button -->
<div class="flex flex-col items-center justify-center py-space-md gap-space-md">
<div class="relative flex items-center justify-center">
<!-- Pulsing outer rings -->
<span class="absolute w-48 h-48 rounded-full bg-primary/20 animate-ping" style="animation-duration: 2.4s;"></span>
<span class="absolute w-44 h-44 rounded-full bg-primary/30 animate-pulse"></span>
<!-- Main Mic Button -->
<button class="relative w-40 h-40 rounded-full bg-primary text-on-primary shadow-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform min-h-[56px] min-w-[56px]" id="mic-btn" type="button">
<span class="material-symbols-outlined text-[54px]" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="font-label-lg text-label-lg" id="mic-label">నొక్కండి &amp; మాట్లాడండి</span>
</button>
</div>
<!-- Type Instead Link -->
<button class="min-h-[56px] px-space-lg rounded-full bg-surface-container-lowest text-secondary font-label-lg text-label-lg flex items-center gap-space-xs shadow-sm active:scale-95 transition-transform border border-outline-variant/40" id="type-btn" type="button">
<span class="material-symbols-outlined text-[28px]">keyboard</span>
<span id="type-label">టైప్ చేయండి</span>
</button>
</div>
<!-- Prominent Play Demo Button -->
<button class="w-full min-h-[64px] px-space-md rounded-xl bg-secondary text-on-secondary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md active:scale-95 transition-transform" id="demo-btn" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span id="demo-label">డెమో చూడండి</span>
</button>
<!-- Reassuring Privacy Note -->
<div class="bg-surface-container-low rounded-xl p-space-md flex items-start gap-space-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[32px] text-secondary shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<p class="font-body-md text-body-md text-on-surface" id="privacy-text">మీ సమాధానాలను మేము ఏ సర్వర్‌లోనూ నిల్వ చేయము. మీ బ్రౌజర్ ద్వారానే వాయిస్ గుర్తింపు జరుగుతుంది.</p>
</div>
</div>
<script>
  (function () {
    var isTelugu = false;
    var langToggle = document.getElementById('lang-toggle');
    var greetingText = document.getElementById('greeting-text');
    var micLabel = document.getElementById('mic-label');
    var typeLabel = document.getElementById('type-label');
    var demoLabel = document.getElementById('demo-label');
    var privacyText = document.getElementById('privacy-text');

    if (langToggle) {
      langToggle.addEventListener('click', function () {
        isTelugu = !isTelugu;
        if (isTelugu) {
          greetingText.textContent = 'నమస్తే! పింఛన్ల గురించి అడగండి.';
          micLabel.textContent = 'మాట్లాడండి';
          typeLabel.textContent = 'టైప్ చేయండి';
          demoLabel.textContent = 'డెమో చూడండి';
          privacyText.textContent = 'మేము మీ సమాధానాలను ఏ సర్వర్‌లోనూ నిల్వ చేయము. వాయిస్ గుర్తింపు మీ బ్రౌజర్ ద్వారా మాత్రమే నిర్వహించబడుతుంది.';
        } else {
          greetingText.textContent = 'Namaste! Ask about pensions.';
          micLabel.textContent = 'Tap & Speak';
          typeLabel.textContent = 'Type instead';
          demoLabel.textContent = 'Play demo';
          privacyText.textContent = "We don't store your answers on any server. Voice recognition is handled by your browser.";
        }
      });
    }
  })();
</script></main></body></html>
